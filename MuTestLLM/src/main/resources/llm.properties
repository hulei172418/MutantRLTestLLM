# ============================================================
# Global generation parameters
# These values are shared by all providers unless overridden later.
# ============================================================

# Output budget for non-dynamic fallback and initial generation fallback.
# This controls model completion/output tokens, not input prompt tokens.
llm.max.tokens=16000
# Concurrent generation
llm.threads=6
llm.pipeline.enabled=true
llm.pipeline.generation.threads=8
llm.pipeline.post.threads=8
llm.batch.suite.evaluate=false
llm.executor.timing.enabled=true
llm.executor.timing.min.millis=100
llm.temperature=0.2
llm.api.max.attempts=2
llm.max.repair.rounds=1
#llm.thinking.type=disabled

# Deterministic scaffolds are useful for a few proven families, but broad
# class-wide takeover can hide mutation-specific evidence from the LLM.
llm.deterministic.csvprinter.classwide.enabled=false
llm.deterministic.lexer.classwide.enabled=false

# If regenerating test cases with the large language model, use the following configuration.
llm.skip.existing.compiled=false
llm.force.regenerate=true
# # Otherwise, if using cached results
# llm.skip.existing.compiled=true
# llm.force.regenerate=false

# Evidence-aware dynamic budget.
# Budgets are now ratio-based:
#   repairBudget = initialBudget * stageRatio * errorRatio
# Do not set repair absolute budgets unless you also change the Java code.
llm.dynamic.budget.enabled=true
llm.oversize.prompt.policy=truncate

# Evidence generation controls.
# false: skip legacy Soot/Jimple/graph/debug evidence and output only the compact clean schema.
# true: keep generating legacy graph/debug evidence for diagnosis.
llm.evidence.legacy.enabled=false

# Base budget for attempt 0 / initial generation.
llm.initial.max.input.tokens=16000
llm.initial.max.input.chars=60000
#llm.initial.max.tokens=2200
llm.initial.max.tokens=10000

llm.connect.timeout.millis=10000
llm.read.timeout.millis=20000

# Optional conversion when chars are derived from tokens. If max.input.chars is set,
# that explicit char budget is used as the base and then scaled by ratios.
llm.budget.chars.per.token=3.0

# Stage scaling ratios.
# attempt 1 repair: base * repair1 ratio
# attempt >=2 repair: base * repair2 ratio
llm.repair1.input.ratio=1.80
llm.repair1.output.ratio=1.45
llm.repair2.input.ratio=2.60
llm.repair2.output.ratio=2.30

# Ratio-derived hard ceilings. These prevent unlimited growth.
# hardInput = initialInput * hard.input.ratio
# hardOutput = initialOutput * hard.output.ratio
llm.hard.input.ratio=3.00
llm.hard.output.ratio=3.00

# Optional absolute hard overrides. Use 0 or omit to keep ratio-derived hard ceilings.
llm.hard.max.input.tokens=0
llm.hard.max.input.chars=0
llm.hard.max.tokens=0

# Error-aware ratios applied on top of the stage ratio.
# Example: repair1 constructor output = initialOutput * repair1.output.ratio * constructor.output.ratio
llm.budget.constructor.input.ratio=1.20
llm.budget.constructor.output.ratio=1.20
llm.budget.method.input.ratio=1.10
llm.budget.method.output.ratio=1.10
llm.budget.stub.input.ratio=1.20
llm.budget.stub.output.ratio=1.30
llm.budget.long.javac.input.ratio=1.25
llm.budget.long.javac.output.ratio=1.25

# If the previous response is reasoning-only, increase only the output budget.
llm.budget.reasoning.only.output.ratio=2.00







# ============================================================
# LLM provider selection
# Change only this value to switch between different LLM APIs.
# Available examples: deepseek, openai, qwen, vectorengine, ollama, wansk, yxkl
# ============================================================
llm.provider=vectorengine


# ============================================================
# DeepSeek
# OpenAI-compatible chat completions API
# ============================================================
llm.providers.deepseek.api.url=https://api.deepseek.com/chat/completions
llm.providers.deepseek.model=deepseek-v4-flash
llm.providers.deepseek.api.key=PUT_YOUR_DASHSCOPE_KEY_HERE


# ============================================================
# OpenAI
# OpenAI official chat completions API
# ============================================================
llm.providers.openai.api.url=https://api.openai.com/v1/chat/completions
llm.providers.openai.model=gpt-5.4
llm.providers.openai.api.key=PUT_YOUR_OPENAI_KEY_HERE


# ============================================================
# Alibaba Cloud DashScope / Qwen
# OpenAI-compatible mode
# ============================================================
llm.providers.qwen.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
llm.providers.qwen.model=qwen-plus
llm.providers.qwen.api.key=PUT_YOUR_DASHSCOPE_KEY_HERE


# ============================================================
# vectorengine / vectorengine
# OpenAI-compatible chat completions API
# ============================================================
llm.providers.vectorengine.api.url=https://api.vectorengine.cn/v1/chat/completions
# llm.providers.vectorengine.model=claude-opus-4-8
# llm.providers.vectorengine.model=deepseek-v4-flash
llm.providers.vectorengine.model=qwen3-coder-flash
llm.providers.vectorengine.api.key=PUT_YOUR_DASHSCOPE_KEY_HERE


# ============================================================
# wansk / wansk
# OpenAI-compatible chat completions API
# ============================================================
llm.providers.wansk.api.url=https://api.wansk.top/v1/chat/completions
llm.providers.wansk.model=deepseek-v4-flash
llm.providers.wansk.api.key=PUT_YOUR_DASHSCOPE_KEY_HERE


# ============================================================
# yxkl / yxkl
# OpenAI-compatible chat completions API
# ============================================================
llm.providers.yxkl.api.url=https://ai.yxkl.cloud/v1/chat/completions
llm.providers.yxkl.model=deepseek-v4-flash
llm.providers.yxkl.api.key=PUT_YOUR_DASHSCOPE_KEY_HERE


# ============================================================
# yungpt
# OpenAI-compatible chat completions API
# ============================================================
llm.providers.yungpt.api.url=https://yungpt.com/v1/chat/completions
llm.providers.yungpt.model=deepseek-v4-flash
llm.providers.yungpt.api.key=PUT_YOUR_DASHSCOPE_KEY_HERE


# ============================================================
# Local Ollama
# OpenAI-compatible local API
# The api.key value is usually ignored by Ollama,
# but a non-empty value is kept for compatibility.
# ============================================================
llm.providers.ollama.api.url=http://localhost:11434/v1/chat/completions
llm.providers.ollama.model=qwen2.5-coder:32b
llm.providers.ollama.api.key=ollama




# ============================================================
# RL first-stage contextual bandit controls
# ============================================================
mujava.config.path=mujava.config
mujava.libraries.path=libraries.json
rl.enabled=true
rl.mode=bandit
# 强化学习策略：linucb、epsilon_greedy
rl.policy=linucb
rl.epsilon=0.30
rl.log.path=logs/rl/trajectory.jsonl
rl.policy.store.path=logs/rl/policy-store.json
rl.feedback.log.path=logs/rl/failure-feedback.jsonl
rl.warmup.action=BASELINE
rl.regeneration.enabled=true
rl.regeneration.max.rounds=2
rl.reference.regeneration.enabled=true
rl.reference.regeneration.max.references=2
# Prior-round history is used by LinUCB state and by initial/repair prompts.
rl.history.enabled=true
rl.history.reference.enabled=true
rl.history.reference.max.references=2
# 编码: one_hot_19、six_class
rl.linucb.operator.encoding=one_hot_19
llm.deterministic.scaffold.enabled=false
loop.max.rounds=2
loop.verify.last.repair=true

# Generalized formal-experiment defaults: benchmark-specific rewrites are opt-in.
llm.benchmark.adapters.enabled=false
# Semantic precheck is advisory by default; javac + execution decide the outcome.
llm.semantic.precheck.hardReject=false
# Generated-test Java level is resolved from each tested module pom.xml; no fixed JDK level is guessed here.
